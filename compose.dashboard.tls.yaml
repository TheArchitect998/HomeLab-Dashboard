# Standalone dashboard Compose file with read-only agent certificate access.
# Set NODESENTINEL_AGENT_CERTS_DIR to a
# host directory containing only public certificates, then use
# /etc/nodesentinel/certs/<filename> in ca_cert. Previous certificate paths
# stay mounted for existing configurations.
services:
  dashboard:
    extends:
      file: compose.yaml
      service: dashboard
    volumes:
      - type: bind
        source: "${NODESENTINEL_AGENT_CERTS_DIR:-${HOMELAB_AGENT_CERTS_DIR:?Set NODESENTINEL_AGENT_CERTS_DIR to a directory of public certificates}}"
        target: /etc/nodesentinel/certs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${NODESENTINEL_AGENT_CERTS_DIR:-${HOMELAB_AGENT_CERTS_DIR:?Set NODESENTINEL_AGENT_CERTS_DIR to a directory of public certificates}}"
        target: /etc/homelab-dashboard/certs
        read_only: true
        bind:
          create_host_path: false

volumes:
  dashboard-state:
