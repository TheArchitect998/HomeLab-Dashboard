# Overlay for S.M.A.R.T. monitoring. Combine with an agent Compose file:
#   docker compose -f compose.agent.yaml -f compose.agent.smart.yaml up -d
# Edit the device list to match the host's disks. SYS_RAWIO is required for SMART commands.
services:
  agent:
    environment:
      HOMELAB_ENABLE_SMART: "1"
    cap_add:
      - SYS_RAWIO
    devices:
      - /dev/sda:/dev/sda
      # - /dev/nvme0:/dev/nvme0
