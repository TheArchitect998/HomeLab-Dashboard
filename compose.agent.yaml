name: nodesentinel-agent

services:
  agent:
    image: "${NODESENTINEL_AGENT_IMAGE:-thearchitect998/nodesentinel-agent:latest}"
    pull_policy: always
    restart: unless-stopped
    # UFW and host network statistics require:
    # network_mode: host
    environment:
      NODESENTINEL_AGENT_KEY: "${NODESENTINEL_AGENT_KEY:-${HOMELAB_AGENT_KEY:?Set NODESENTINEL_AGENT_KEY before starting the agent}}"
      NODESENTINEL_AGENT_NAME: "${NODESENTINEL_AGENT_NAME:?Set the push agent name configured in the dashboard}"
      NODESENTINEL_HUB_URL: "${NODESENTINEL_HUB_URL:?Set the dashboard wss:// URL}"
      # Optional private dashboard CA certificate:
      # NODESENTINEL_HUB_CA_CERT: /tls/hub-ca.crt
      # NODESENTINEL_AGENT_PUSH_SECONDS: "15"

      # Root filesystem usage: enable this and the host-root mount below.
      # NODESENTINEL_ENABLE_HOST_ROOT: "1"

      # Docker status and events: enable this and the Docker socket below.
      # NODESENTINEL_ENABLE_DOCKER: "1"

      # Journal: enable this and mount only the host journal directory below.
      # Details: README.md#optional-security-sources
      # NODESENTINEL_ENABLE_JOURNAL: "1"
      # NODESENTINEL_JOURNAL_DIR: /host/journal

      # Fail2Ban: Set to "1" and verify the host socket path.
      # Details: README.md#optional-security-sources
      # NODESENTINEL_ENABLE_FAIL2BAN: "1"
      # NODESENTINEL_FAIL2BAN_SOCKET: /host/fail2ban/fail2ban.sock

      # UFW: Also enable host networking, NET_ADMIN, /run, and /etc/ufw.
      # Details: README.md#optional-security-sources
      # NODESENTINEL_ENABLE_UFW: "1"

      # S.M.A.R.T.: Also enable SYS_RAWIO and devices.
      # Details: README.md#hardware-metrics
      # NODESENTINEL_ENABLE_SMART: "1"

    cap_drop:
      - ALL
    # Enable only the capabilities required by the selected features:
    # cap_add:
    #   - NET_ADMIN
    #   - SYS_RAWIO
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      # UFW: Enable together with NET_ADMIN, host networking, and /etc/ufw:
      # - /run
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
        bind:
          create_host_path: false
      # Host root: exposes host files even though the mount is read-only.
      # - type: bind
      #   source: /
      #   target: /host/root
      #   read_only: true
      #   bind:
      #     create_host_path: false
      # Docker socket: root-equivalent access even with read_only.
      # - type: bind
      #   source: /var/run/docker.sock
      #   target: /var/run/docker.sock
      #   read_only: true
      #   bind:
      #     create_host_path: false
      # Journal: restrict this path to the host's actual journal directory.
      # - type: bind
      #   source: /var/log/journal/<machine-id>
      #   target: /host/journal
      #   read_only: true
      #   bind:
      #     create_host_path: false
      # Fail2Ban socket: grants administrative access to Fail2Ban.
      # - type: bind
      #   source: /run/fail2ban
      #   target: /host/fail2ban
      #   read_only: true
      #   bind:
      #     create_host_path: false
      # UFW: Enable only when UFW status is required.
      # Details: README.md#optional-security-sources
      # - type: bind
      #   source: /etc/ufw
      #   target: /etc/ufw
      #   read_only: true
      #   bind:
      #     create_host_path: false
      # TLS: mount a public CA certificate when the dashboard uses a private CA.
      # - type: bind
      #   source: "${NODESENTINEL_HUB_CA_DIR:?Set NODESENTINEL_HUB_CA_DIR}"
      #   target: /tls
      #   read_only: true
      #   bind:
      #     create_host_path: false
    # S.M.A.R.T.: Enable with NODESENTINEL_ENABLE_SMART and SYS_RAWIO.
    # Details: README.md#hardware-metrics
    # devices:
    #   - "${NODESENTINEL_SMART_DEVICE:-/dev/sda}:${NODESENTINEL_SMART_DEVICE:-/dev/sda}"
