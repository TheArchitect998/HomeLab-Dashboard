services:
  agent:
    extends:
      file: compose.agent.yaml
      service: agent
    network_mode: host
    ports: !reset []
    cap_add:
      - NET_ADMIN
    tmpfs:
      - /run
    command:
      - uvicorn
      - agent:app
      - --host
      - "${HOMELAB_AGENT_BIND_ADDRESS:-127.0.0.1}"
      - --port
      - "${HOMELAB_AGENT_PORT:-9100}"
    environment:
      HOMELAB_ENABLE_UFW: "1"
      HOMELAB_ENABLE_FAIL2BAN: "${HOMELAB_ENABLE_FAIL2BAN:-0}"
      HOMELAB_FAIL2BAN_SOCKET: /host/root/run/fail2ban/fail2ban.sock
    volumes:
      - type: bind
        source: /etc/ufw
        target: /etc/ufw
        read_only: true
        bind:
          create_host_path: false
