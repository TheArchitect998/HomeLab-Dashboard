<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HomeLab Dashboard v3</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --panel-alt: #0f172a;
        --border: #374151;
        --text: #edf2f7;
        --muted: #9ca3af;
        --ok: #34d399;
        --bad: #f87171;
        --accent: #93c5fd;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 system-ui, sans-serif;
      }

      header {
        padding: 12px 18px;
        background: #0f172a;
        border-bottom: 1px solid var(--border);
      }

      main {
        padding: 12px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 10px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
      }

      .card h2 { margin: 0 0 8px; font-size: 1rem; }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }

      .box {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 6px;
        text-align: center;
      }

      .label {
        font-size: 0.62rem;
        text-transform: uppercase;
        color: var(--muted);
      }

      .value {
        display: block;
        margin-top: 4px;
        font-weight: 700;
        font-size: 0.95rem;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        font-size: 0.76rem;
      }

      .section {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 8px;
        margin-top: 8px;
      }

      .section-title {
        font-size: 0.68rem;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 4px;
      }

      .section-content {
        max-height: 90px;
        overflow-y: auto;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 0.7rem;
      }

      .ufw-table-wrap {
        overflow-x: auto;
      }

      .ufw-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 220px;
      }

      .ufw-table th,
      .ufw-table td {
        padding: 4px 6px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        font-size: 0.68rem;
        vertical-align: top;
      }

      .ufw-table th {
        color: var(--muted);
        text-transform: uppercase;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }

      th, td {
        padding: 5px 4px;
        border-bottom: 1px solid var(--border);
        font-size: 0.68rem;
      }

      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .muted { color: var(--muted); }

      @media (max-width: 420px) {
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <header>
      <b>HomeLab Dashboard</b>
      <span class="muted" id="updated">Lade…</span>
    </header>
    <main id="app"></main>
    <script>
      const escapeHtml = (value) => {
        const text = String(value ?? '—');
        return text.replace(/[&<>\"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '\"': '&quot;',
          "'": '&#39;'
        }[char]));
      };

      const normalizeJailName = (value) => String(value || '').replace(/^[-`\s]+/, '').trim();

      function renderUfwRows(rawUfw) {
        const raw = String(rawUfw || '').trim();
        if (!raw) return '<tr><td colspan="3">Keine UFW-Ausgabe</td></tr>';

        const lines = raw
          .split(/\n/)
          .map((line) => line.trim())
          .filter((line) => line && !line.startsWith('To') && !line.startsWith('--'));

        if (!lines.length) return '<tr><td colspan="3">Keine UFW-Ausgabe</td></tr>';

        return lines.map((line) => {
          const parts = line.split(/\s+/);
          if (parts.length < 3) {
            return `<tr><td colspan="3">${escapeHtml(line)}</td></tr>`;
          }

          const to = parts[0];
          const action = parts.slice(1, -1).join(' ');
          const from = parts[parts.length - 1];

          return `
            <tr>
              <td>${escapeHtml(to)}</td>
              <td>${escapeHtml(action)}</td>
              <td>${escapeHtml(from)}</td>
            </tr>
          `;
        }).join('');
      }

      function renderDockerRows(dockerList) {
        if (!Array.isArray(dockerList) || dockerList.length === 0) {
          return '<tr><td colspan="4">Keine Container</td></tr>';
        }

        return dockerList.map((container) => {
          const state = container.state || container.status || 'unknown';
          const startedAt = container.started_at ? new Date(container.started_at).toLocaleString() : '—';
          const statusClass = state === 'running' ? 'ok' : 'bad';
          return `
            <tr>
              <td>${escapeHtml(container.name)}</td>
              <td><span class="${statusClass}">${escapeHtml(state)}</span></td>
              <td>${escapeHtml(startedAt)}</td>
              <td>${escapeHtml(container.restart_count ?? 0)}</td>
            </tr>
          `;
        }).join('');
      }

      function renderJailCards(fail2banData) {
        const jails = Array.isArray(fail2banData?.jails) ? fail2banData.jails : [];
        if (!jails.length) return '<div class="muted">Keine Jails aktiv</div>';

        return jails.map((rawJail) => {
          const jailName = normalizeJailName(rawJail);
          const detail = fail2banData.details?.[jailName] || fail2banData.details?.[rawJail] || 'Keine Details verfügbar';
          return `
            <div class="section">
              <div class="section-title">${escapeHtml(jailName)}</div>
              <div class="section-content">${escapeHtml(detail)}</div>
            </div>
          `;
        }).join('');
      }

      function renderHostInner(name, data) {
        if (!data.online) {
          return `
            <h2>${escapeHtml(name)} <span class="bad">offline</span></h2>
            <div class="bad">${escapeHtml(data.error || 'Host nicht erreichbar')}</div>
          `;
        }

        const fail2ban = data.fail2ban || {};
        const ufw = data.ufw || {};

        return `
          <h2>${escapeHtml(name)} <span class="ok">online</span></h2>
          <div class="grid">
            <div class="box"><span class="label">Temp</span><span class="value">${escapeHtml(data.temperature_c)}°C</span></div>
            <div class="box"><span class="label">CPU</span><span class="value">${escapeHtml(data.cpu_percent)}%</span></div>
            <div class="box"><span class="label">RAM</span><span class="value">${escapeHtml(data.ram_percent)}%</span></div>
            <div class="box"><span class="label">Disk</span><span class="value">${escapeHtml(data.storage_percent)}%</span></div>
          </div>

          <div class="status-row"><span>UFW</span><span>${ufw.active ? '<span class="ok">Aktiv</span>' : '<span class="bad">Inaktiv</span>'}</span></div>
          <div class="section">
            <div class="ufw-table-wrap">
              <table class="ufw-table">
                <thead>
                  <tr><th>To</th><th>Action</th><th>From</th></tr>
                </thead>
                <tbody>${renderUfwRows(ufw.raw)}</tbody>
              </table>
            </div>
          </div>

          <div class="status-row"><span>Fail2Ban</span><span>${fail2ban.active ? '<span class="ok">Aktiv</span>' : '<span class="bad">Inaktiv</span>'}</span></div>
          <div class="status-row"><span>Jails</span><span>${(fail2ban.jails || []).length}</span></div>
          ${renderJailCards(fail2ban)}

          <table>
            <thead><tr><th>Container</th><th>Status</th><th>Start</th><th>Re</th></tr></thead>
            <tbody>${renderDockerRows(data.docker || [])}</tbody>
          </table>
        `;
      }

      function renderHostCard(name, data) {
        return `<section class="card host-card" data-host="${escapeHtml(name)}">${renderHostInner(name, data)}</section>`;
      }

      function syncDashboard(data) {
        const app = document.getElementById('app');
        const currentCards = new Map(
          [...app.querySelectorAll('.host-card')].map((card) => [card.dataset.host, card])
        );
        const nextHosts = new Set(Object.keys(data));

        for (const [name, hostData] of Object.entries(data)) {
          const existing = currentCards.get(name);
          if (existing) {
            existing.innerHTML = renderHostInner(name, hostData);
          } else {
            app.insertAdjacentHTML('beforeend', renderHostCard(name, hostData));
          }
        }

        for (const [name, card] of currentCards.entries()) {
          if (!nextHosts.has(name)) {
            card.remove();
          }
        }
      }

      async function loadDashboard() {
        try {
          const response = await fetch('/api/dashboard');
          const data = await response.json();
          syncDashboard(data);
          document.querySelector('#updated').textContent = 'Aktualisiert: ' + new Date().toLocaleTimeString();
        } catch (error) {
          document.querySelector('#updated').textContent = 'Fehler';
        }
      }

      loadDashboard();
      setInterval(loadDashboard, 15000);
    </script>
  </body>
</html>
