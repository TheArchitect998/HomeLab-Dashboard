<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071321" />
    <title>Homelab Monitor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #071321;
        --surface: #0b1a2b;
        --surface-raised: #0e2034;
        --surface-hover: #132a43;
        --border: #1a3551;
        --text: #e4efff;
        --muted: #829ab8;
        --blue: #229cff;
        --cyan: #12c9c3;
        --purple: #a45bff;
        --green: #10d1b3;
        --red: #ff6b73;
        --amber: #ffbf5b;
        --sidebar-width: 154px;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 68% -20%, rgba(19, 77, 123, 0.18), transparent 50%),
          var(--bg);
        color: var(--text);
        font: 13px/1.45 Inter, "Segoe UI", system-ui, sans-serif;
      }

      button, a { font: inherit; }
      a { color: inherit; text-decoration: none; }

      .topbar {
        position: sticky;
        z-index: 5;
        top: 0;
        display: flex;
        min-height: 48px;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 8px 18px;
        background: rgba(7, 19, 33, 0.96);
        border-bottom: 1px solid #142b43;
        backdrop-filter: blur(12px);
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 25px;
        height: 25px;
        color: var(--cyan);
      }

      .brand-title {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.15;
      }

      .brand-subtitle {
        margin-top: 2px;
        color: var(--muted);
        font-size: 10px;
      }

      .topbar-meta {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .language-select {
        min-height: 28px;
        padding: 3px 7px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--surface);
        color: var(--text);
        font-size: 10px;
        cursor: pointer;
      }

      .language-select:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      .system-state, .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .system-state { color: var(--cyan); }

      .dot {
        width: 7px;
        height: 7px;
        flex: 0 0 7px;
        border-radius: 50%;
        background: currentColor;
      }

      .layout {
        display: grid;
        min-height: calc(100vh - 48px);
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 48px;
        display: flex;
        height: calc(100vh - 48px);
        flex-direction: column;
        gap: 4px;
        padding: 14px 8px;
        scrollbar-width: none;
        border-right: 1px solid #112941;
        background: rgba(8, 22, 38, 0.72);
      }

      .sidebar::-webkit-scrollbar { display: none; }

      .nav-link {
        display: flex;
        min-height: 34px;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        border-radius: 6px;
        color: #8ca6c4;
        font-size: 11px;
        transition: background 120ms ease, color 120ms ease;
      }

      .nav-link:hover, .nav-link.active {
        background: #102b47;
        color: #4aaeff;
      }

      .nav-icon {
        width: 15px;
        height: 15px;
        color: currentColor;
      }

      .sidebar-note {
        margin: auto 8px 4px;
        color: #627b99;
        font-size: 10px;
      }

      .page-footer {
        padding: 14px 2px 0;
        color: #627b99;
        font-size: 10px;
        text-align: right;
      }

      .page-footer a { color: #91a9c5; }
      .page-footer a:hover { color: var(--blue); }

      .content {
        width: 100%;
        max-width: 1720px;
        margin: 0 auto;
        padding: 15px 17px 24px;
      }

      .error-banner {
        margin-bottom: 12px;
        padding: 9px 12px;
        border: 1px solid rgba(255, 107, 115, 0.35);
        border-radius: 6px;
        background: rgba(255, 107, 115, 0.08);
        color: #ff9a9f;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 12px;
        align-items: start;
      }

      .metrics-grid {
        display: grid;
        grid-column: span 9;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .panel, .metric-card {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: linear-gradient(145deg, rgba(13, 31, 51, 0.98), rgba(9, 25, 42, 0.98));
        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.12);
      }

      .metric-card {
        position: relative;
        min-height: 150px;
        padding: 13px 12px 9px;
      }

      .metric-head {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .metric-icon {
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        place-items: center;
        border-radius: 5px;
        background: rgba(34, 156, 255, 0.13);
        color: var(--blue);
      }

      .metric-card[data-metric="ram"] .metric-icon { background: rgba(18, 201, 195, 0.12); color: var(--cyan); }
      .metric-card[data-metric="disk"] .metric-icon { background: rgba(164, 91, 255, 0.13); color: var(--purple); }
      .metric-card[data-metric="temperature"] .metric-icon { background: rgba(18, 201, 195, 0.1); color: var(--cyan); }
      .metric-icon svg { width: 21px; height: 21px; }

      .metric-label {
        color: #a9bfdc;
        font-size: 11px;
        font-weight: 650;
      }

      .metric-value {
        margin: 2px 0 0 42px;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.1;
      }

      .metric-caption {
        margin: 3px 0 0 42px;
        color: var(--muted);
        font-size: 10px;
      }

      .sparkline {
        display: block;
        width: 100%;
        height: 33px;
        margin-top: 6px;
        overflow: visible;
      }

      .metric-foot {
        color: #829bb8;
        font-size: 9px;
      }

      .panel { scroll-margin-top: 62px; }

      .panel-heading {
        display: flex;
        min-height: 36px;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 11px;
        border-bottom: 1px solid #17314b;
      }

      .panel-title {
        margin: 0;
        font-size: 11px;
        font-weight: 650;
      }

      .panel-meta {
        color: var(--muted);
        font-size: 9px;
      }

      .hosts-panel { grid-column: span 3; }
      .resource-panel { grid-column: span 7; }
      .temperature-panel { grid-column: span 5; }
      .containers-panel { grid-column: span 7; }
      .side-stack { display: grid; grid-column: span 5; gap: 12px; }

      .host-row {
        display: grid;
        min-height: 58px;
        grid-template-columns: minmax(82px, 1fr) repeat(4, minmax(33px, auto));
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid rgba(26, 53, 81, 0.7);
      }

      .host-row:last-child { border-bottom: 0; }

      .host-name-wrap { min-width: 0; }
      .host-name {
        overflow: hidden;
        font-size: 10px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .host-status {
        margin-top: 3px;
        color: var(--green);
        font-size: 9px;
      }

      .host-status.offline { color: var(--red); }

      .host-stat {
        text-align: right;
        color: #c3d4e9;
        font-size: 9px;
      }

      .host-stat span {
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 8px;
      }

      .chart-wrap { padding: 7px 10px 8px; }
      .chart-svg { display: block; width: 100%; height: 178px; }
      .chart-grid { stroke: #1b3550; stroke-width: 1; }
      .chart-label { fill: #8199b5; font: 9px "Segoe UI", sans-serif; }
      .chart-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .chart-area { opacity: 0.11; }

      .legend {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        color: var(--muted);
        font-size: 9px;
        white-space: nowrap;
      }

      .legend-item { display: inline-flex; align-items: center; gap: 5px; }
      .legend-dot { width: 7px; height: 7px; border-radius: 50%; }

      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        padding: 7px 9px;
        border-bottom: 1px solid rgba(26, 53, 81, 0.75);
        text-align: left;
        font-size: 10px;
        white-space: nowrap;
      }

      th {
        color: #91a9c5;
        font-size: 9px;
        font-weight: 550;
      }

      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover { background: rgba(36, 76, 115, 0.14); }

      .status-text { color: var(--green); }
      .status-text.bad { color: var(--red); }
      .status-text.warn { color: var(--amber); }
      .empty-row { padding: 18px 10px; color: var(--muted); text-align: center; }

      .resource-list { padding: 4px 11px 9px; }
      .resource-row {
        display: grid;
        grid-template-columns: minmax(96px, 1.05fr) minmax(70px, 1.7fr) 48px;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
      }

      .resource-host {
        overflow: hidden;
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .resource-bars { display: grid; gap: 4px; }
      .bar-track { height: 6px; overflow: hidden; border-radius: 8px; background: #19304a; }
      .bar-fill { height: 100%; border-radius: inherit; background: var(--blue); }
      .bar-fill.ram { background: var(--cyan); }
      .resource-values { color: #b7c9df; font-size: 9px; text-align: right; line-height: 1.5; }

      .security-content { padding: 7px 11px 10px; }
      .security-host {
        padding: 7px 0;
        border-bottom: 1px solid rgba(26, 53, 81, 0.7);
      }

      .security-host:last-child { border-bottom: 0; }
      .security-host-name { margin-bottom: 5px; font-size: 10px; font-weight: 650; }
      .security-state-row { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 9px; }
      .security-state-row + .security-state-row { margin-top: 4px; }

      details { margin-top: 6px; color: #91a9c5; font-size: 9px; }
      summary { cursor: pointer; }
      .security-detail {
        max-height: 110px;
        margin-top: 5px;
        overflow: auto;
        color: #afc2d9;
        font: 9px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .muted { color: var(--muted); }

      @media (max-width: 1120px) {
        :root { --sidebar-width: 132px; }
        .metrics-grid { grid-column: span 12; }
        .hosts-panel { grid-column: span 12; }
        .hosts-panel .host-row { grid-template-columns: minmax(130px, 1fr) repeat(4, minmax(45px, auto)); }
        .resource-panel, .temperature-panel { grid-column: span 6; }
        .containers-panel, .side-stack { grid-column: span 6; }
      }

      @media (max-width: 720px) {
        :root { --sidebar-width: 0px; }
        .layout { display: block; }
        .sidebar {
          position: sticky;
          z-index: 4;
          top: 48px;
          display: flex;
          width: 100%;
          height: auto;
          flex-direction: row;
          overflow-x: auto;
          padding: 5px 8px;
          border-right: 0;
          border-bottom: 1px solid #112941;
        }
        .nav-link { min-height: 32px; flex: 0 0 auto; padding: 0 9px; }
        .sidebar-note { display: none; }
        .content { padding: 11px 10px 20px; }
        .metrics-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .metric-card { min-height: 140px; padding: 11px 9px 8px; }
        .dashboard-grid { gap: 9px; }
        .resource-panel, .temperature-panel, .containers-panel, .side-stack { grid-column: span 12; }
        .chart-svg { height: 165px; }
        .topbar-meta { gap: 8px; }
        .topbar-meta .updated-label { display: none; }
      }

      @media (max-width: 420px) {
        .brand-subtitle { display: none; }
        .topbar { gap: 8px; padding-right: 10px; padding-left: 10px; }
        .topbar-meta { gap: 6px; font-size: 9px; }
        .topbar-meta > span[aria-hidden="true"] { display: none; }
        .language-select { max-width: 68px; padding-right: 3px; padding-left: 3px; }
        .system-state { max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
        .host-row { grid-template-columns: minmax(75px, 1fr) repeat(4, minmax(30px, auto)); gap: 5px; padding-right: 7px; padding-left: 7px; }
        th, td { padding-right: 7px; padding-left: 7px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>

        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m12 2 9 4.5-9 4.5-9-4.5L12 2Z" />

          <span class="brand-title">Homelab Monitor</span>
          <span class="brand-subtitle" data-i18n="brandSubtitle">Infrastructure Overview</span>
        </span>

      <div class="topbar-meta">
        <label class="sr-only" for="language-select" data-i18n="languageLabel">Sprache</label>
        <select id="language-select" class="language-select" aria-label="Sprache" data-i18n-aria-label="languageLabel">

          <option value="en">English</option>
          <option value="fr">Français</option>

        <span id="system-state" class="system-state"><span class="dot"></span><span data-i18n="loadingStatus">Lade Status</span></span>
        <span aria-hidden="true">|</span>
        <span><span class="updated-label" data-i18n="updated">Aktualisiert</span> <time id="updated">—</time></span>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" aria-label="Hauptnavigation" data-i18n-aria-label="mainNavigation">
        <a class="nav-link active" href="#overview">

        </a>
        <a class="nav-link" href="#hosts">

        <a class="nav-link" href="#containers">

          <span data-i18n="containers">Container</span>
        </a>
        <a class="nav-link" href="#security">

        </a>
        <span class="sidebar-note" data-i18n="pollInterval">Abfrage alle 15 Sekunden</span>
      </nav>

      <main class="content" id="overview">
        <div id="error-banner" class="error-banner" role="status" hidden></div>
        <div id="app" class="dashboard-grid" aria-live="polite">

            <span data-i18n="dashboardLoading">Dashboard wird geladen …</span>

          inactive: 'Inactive',
          firewallRules: 'Show firewall rules',
          fail2banDetails: 'Show Fail2Ban details',
          fail2banJails: 'Fail2Ban · {count} jails',
          dashboardUpdateError: 'Dashboard could not be updated: {error}',

        },
        fr: {

          brandSubtitle: 'Vue d’ensemble de l’infrastructure',
          languageLabel: 'Langue',
          loadingStatus: 'Chargement du statut',
          updated: 'Mis à jour',
          mainNavigation: 'Navigation principale',
          overview: 'Vue d’ensemble',
          hosts: 'Hôtes',
          containers: 'Conteneurs',
          security: 'Sécurité',
          pollInterval: 'Actualisation toutes les 15 secondes',
          dashboardLoading: 'Chargement du tableau de bord …',
          author: 'Auteur',
          allSystemsOnline: 'Tous les systèmes sont en ligne',
          onlineHosts: '{online} hôtes sur {total} en ligne',
          connectionError: 'Erreur de connexion',
          cpu: 'CPU',
          ram: 'RAM',
          disk: 'Disque',
          temperature: 'Température',
          averageUsage: 'Utilisation moyenne',
          averageOccupancy: 'Occupation moyenne',
          averageAllHosts: 'Moyenne des hôtes',
          allReachableHosts: 'Sur tous les hôtes accessibles',
          free: 'libres',
          rootFilesystem: 'Système de fichiers racine',
          noTemperatureData: 'Aucune donnée de température',
          hostsOnline: '{count} en ligne',
          ufwFirewall: 'Pare-feu UFW',
          systemResources: 'Ressources système',
          temperatureTrend: 'Évolution de la température',
          containerServices: 'Services conteneurs',
          containerCountSingular: '{count} conteneur',
          containerCountPlural: '{count} conteneurs',
          host: 'Hôte',
          status: 'État',
          started: 'Démarré',
          restarts: 'Redémarrages',
          hostResources: 'Ressources des hôtes',
          securityStatus: 'État de la sécurité',
          noHostsConfigured: 'Aucun hôte configuré',
          noHostData: 'Aucune donnée d’hôte disponible',
          offlineHost: 'Hôte hors ligne',
          noContainers: 'Aucun conteneur trouvé',
          noSecurityData: 'Aucune donnée de sécurité disponible',
          hostUnreachable: 'Hôte inaccessible',
          noUfwOutput: 'Aucune sortie UFW',
          noDetailsAvailable: 'Aucun détail disponible',
          noActiveJails: 'Aucun jail actif',
          online: 'En ligne',
          offline: 'Hors ligne',
          unknown: 'Inconnu',
          running: 'En cours',
          exited: 'Arrêté',
          paused: 'En pause',
          restarting: 'Redémarrage en cours',
          created: 'Créé',
          removing: 'Suppression en cours',
          dead: 'Arrêté (erreur)',
          active: 'Actif',
          inactive: 'Inactif',
          firewallRules: 'Afficher les règles du pare-feu',
          fail2banDetails: 'Afficher les détails Fail2Ban',
          fail2banJails: 'Fail2Ban · {count} jails',
          dashboardUpdateError: 'Impossible de mettre à jour le tableau de bord : {error}',
          apiHttpError: 'L’API du tableau de bord a répondu avec HTTP {status}',
          invalidData: 'L’API du tableau de bord a renvoyé un format de données invalide'
        }
      };

      const languageLocales = { de: 'de-DE', en: 'en-GB', fr: 'fr-FR' };
      const savedLanguage = localStorage.getItem('homelab-dashboard-language');
      let currentLanguage = Object.hasOwn(translations, savedLanguage) ? savedLanguage : 'de';

      function t(key, values = {}) {
        const message = translations[currentLanguage][key] || translations.de[key] || key;
        return message.replace(/\{(\w+)\}/g, (_, name) => String(values[name] ?? ''));
      }

      function applyTranslations() {
        document.documentElement.lang = currentLanguage;
        document.title = t('pageTitle');
        document.querySelectorAll('[data-i18n]').forEach((element) => {
          element.textContent = t(element.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-aria-label]').forEach((element) => {
          element.setAttribute('aria-label', t(element.dataset.i18nAriaLabel));
        });
        document.querySelector('#language-select').value = currentLanguage;
      }

      function locale() {
        return languageLocales[currentLanguage];
      }

      function updateTimestamp() {
        if (latestUpdatedAt === null) return;
        document.querySelector('#updated').textContent = new Date(latestUpdatedAt).toLocaleTimeString(locale(), {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      }

      const escapeHtml = (value) => String(value ?? '—').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));

      const finite = (value) => {
        if (value === null || value === undefined || value === '') return null;
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      };

      function average(values) {
        const valid = values.map(finite).filter((value) => value !== null);
        return valid.length ? valid.reduce((sum, value) => sum + value, 0) / valid.length : null;
      }

      function formatPercent(value) {
        return value === null ? '—' : `${Math.round(value)}%`;
      }

      function formatTemperature(value) {
        return value === null ? '—' : `${new Intl.NumberFormat(locale(), { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(value)}°C`;
      }

      function formatBytes(value) {
        const bytes = finite(value);
        if (bytes === null) return '—';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let size = bytes;
        let unit = 0;
        while (size >= 1024 && unit < units.length - 1) {
          size /= 1024;
          unit += 1;
        }
        return `${new Intl.NumberFormat(locale(), { maximumFractionDigits: unit > 0 && size < 10 ? 1 : 0 }).format(size)} ${units[unit]}`;
      }

      function iconSvg(type) {
        const paths = {
          cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 1v3m6-3v3M9 20v3m6-3v3M1 9h3m-3 6h3m16-6h3m-3 6h3M9 9h6v6H9z"/>',
          ram: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h2v4H7zm4 0h2v4h-2zm4 0h2v4h-2zM7 3v3m5-3v3m5-3v3M7 18v3m5-3v3m5-3v3"/>',
          disk: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
          temperature: '<path d="M14 14.76V5a3 3 0 0 0-6 0v9.76a5 5 0 1 0 6 0Z"/><path d="M11 11v6"/>'
        };
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[type]}</svg>`;
      }

      function linePath(values, maxValue, width, height, top = 5, bottom = 5) {
        const usableHeight = height - top - bottom;
        const denominator = Math.max(values.length - 1, 1);
        let path = '';
        let drawing = false;
        values.forEach((value, index) => {
          if (finite(value) === null) {
            drawing = false;
            return;
          }
          const x = (index / denominator) * width;
          const y = top + usableHeight - (Math.max(0, Math.min(Number(value), maxValue)) / maxValue) * usableHeight;
          path += `${drawing ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)} `;
          drawing = true;
        });
        return path.trim();
      }

      function renderSparkline(type) {
        const values = chartHistory[type];
        const path = linePath(values, 100, 220, 30, 3, 3);
        if (!path) return '<svg class="sparkline" viewBox="0 0 220 30" aria-hidden="true"></svg>';
        const area = `${path} L220,30 L0,30 Z`;
        const marker = values.length === 1 && finite(values[0]) !== null
          ? `<circle cx="0" cy="${27 - (Math.max(0, Math.min(Number(values[0]), 100)) / 100) * 24}" r="2" fill="${colors[type]}"></circle>`
          : '';
        return `<svg class="sparkline" viewBox="0 0 220 30" preserveAspectRatio="none" aria-hidden="true">
          <path d="${area}" fill="${colors[type]}" opacity=".12"></path>
          <path d="${path}" fill="none" stroke="${colors[type]}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
          ${marker}
        </svg>`;
      }

      function renderMetric(type, label, value, caption, foot) {
        const trend = type === 'temperature' ? 'temperature' : type;
        return `<section class="metric-card" data-metric="${type}">
          <div class="metric-head">
            <span class="metric-icon">${iconSvg(type)}</span>
            <span class="metric-label">${label}</span>
          </div>
          <div class="metric-value">${value}</div>
          <div class="metric-caption">${caption}</div>
          ${renderSparkline(trend)}
          <div class="metric-foot">${foot}</div>
        </section>`;
      }

      function legend(items) {
        return `<span class="legend">${items.map(([label, color]) => `
          <span class="legend-item"><span class="legend-dot" style="background:${color}"></span>${label}</span>
        `).join('')}</span>`;
      }

      function renderChart(title, series, options = {}) {
        const width = 560;
        const height = 178;
        const left = 35;
        const right = 8;
        const top = 10;
        const bottom = 25;
        const plotWidth = width - left - right;
        const plotHeight = height - top - bottom;
        const maxValue = options.max || 100;
        const ticks = options.ticks || [0, 25, 50, 75, 100];
        const count = Math.max(...series.map((item) => item.values.length), 0);
        const xAt = (index) => left + (index / Math.max(count - 1, 1)) * plotWidth;
        const yAt = (value) => top + plotHeight - (value / maxValue) * plotHeight;
        const grid = ticks.map((tick) => `
          <line class="chart-grid" x1="${left}" y1="${yAt(tick)}" x2="${width - right}" y2="${yAt(tick)}"></line>
          <text class="chart-label" x="${left - 7}" y="${yAt(tick) + 3}" text-anchor="end">${tick}${options.suffix || '%'}</text>
        `).join('');
        const labelIndexes = [...new Set([0, 0.25, 0.5, 0.75, 1].map((fraction) => Math.round((count - 1) * fraction)))];
        const xLabels = labelIndexes.map((index) => {
          const time = chartHistory.times?.[index];
          return time ? `<text class="chart-label" x="${xAt(index)}" y="${height - 5}" text-anchor="middle">${new Date(time).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' })}</text>` : '';
        }).join('');
        const graphs = series.map((item) => {
          const values = Array(count - item.values.length).fill(null).concat(item.values);
          const path = linePath(values, maxValue, plotWidth, plotHeight, 0, 0);
          const shiftedPath = path.replace(/([ML])([\d.]+),([\d.]+)/g, (_, command, x, y) => `${command}${(Number(x) + left).toFixed(1)},${(Number(y) + top).toFixed(1)}`);
          const currentValue = finite(item.values[item.values.length - 1]);
          const marker = count === 1 && currentValue !== null
            ? `<circle cx="${left}" cy="${yAt(Math.max(0, Math.min(currentValue, maxValue)))}" r="3" fill="${item.color}"></circle>`
            : '';
          return `<path class="chart-line" d="${shiftedPath}" stroke="${item.color}"></path>${marker}`;
        }).join('');

        return `<section class="panel ${options.className || ''}">
          <div class="panel-heading">
            <h2 class="panel-title">${title}</h2>
            ${legend(series.map((item) => [item.label, item.color]))}
          </div>
          <div class="chart-wrap">
            <svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="${title}">
              ${grid}${graphs}${xLabels}
            </svg>
          </div>
        </section>`;
      }

      function renderHostRows(hosts) {
        const names = Object.keys(hosts);
        if (!names.length) return `<div class="empty-row">${t('noHostsConfigured')}</div>`;
        return names.map((name) => {
          const host = hosts[name] || {};
          const online = Boolean(host.online);
          return `<div class="host-row">
            <div class="host-name-wrap">
              <div class="host-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
              <div class="host-status ${online ? '' : 'offline'}"><span class="dot"></span> ${online ? t('online') : t('offline')}</div>
            </div>
            ${[[t('cpu'), host.cpu_percent, false], [t('ram'), host.ram_percent, false], [t('disk'), host.storage_percent, false], [t('temperature'), host.temperature_c, true]].map(([label, value, isTemperature]) => `
              <div class="host-stat"><span>${label}</span>${online ? (isTemperature ? formatTemperature(finite(value)) : formatPercent(finite(value))) : '—'}</div>
            `).join('')}
          </div>`;
        }).join('');
      }

      function renderHostResources(hosts) {
        const names = Object.keys(hosts);
        if (!names.length) return `<div class="empty-row">${t('noHostData')}</div>`;
        return names.map((name) => {
          const host = hosts[name] || {};
          if (!host.online) return `<div class="resource-row"><div class="resource-host">${escapeHtml(name)}</div><div class="muted">${t('offlineHost')}</div><div class="resource-values">—</div></div>`;
          const cpu = finite(host.cpu_percent);
          const ram = finite(host.ram_percent);
          return `<div class="resource-row">
            <div class="resource-host" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
            <div class="resource-bars" aria-label="${t('cpu')} ${formatPercent(cpu)}, ${t('ram')} ${formatPercent(ram)}">
              <div class="bar-track"><div class="bar-fill" style="width:${cpu === null ? 0 : Math.max(0, Math.min(cpu, 100))}%"></div></div>
              <div class="bar-track"><div class="bar-fill ram" style="width:${ram === null ? 0 : Math.max(0, Math.min(ram, 100))}%"></div></div>
            </div>
            <div class="resource-values">${t('cpu')} ${formatPercent(cpu)}<br>${t('ram')} ${formatPercent(ram)}</div>
          </div>`;
        }).join('');
      }

      function renderContainers(hosts) {
        const rows = Object.entries(hosts).flatMap(([hostName, host]) =>
          (Array.isArray(host?.docker) ? host.docker : []).map((container) => ({ hostName, container }))
        );
        if (!rows.length) return `<tr><td class="empty-row" colspan="5">${t('noContainers')}</td></tr>`;
        return rows.map(({ hostName, container }) => {
          const rawState = container.state || container.status || '';
          const running = rawState.toLowerCase().startsWith('running');
          const state = translations[currentLanguage][rawState.toLowerCase()] || rawState || t('unknown');
          const startedAt = container.started_at && !container.started_at.startsWith('0001-')
            ? new Date(container.started_at).toLocaleString(locale(), { dateStyle: 'short', timeStyle: 'short' })
            : '—';
          return `<tr>
            <td>${escapeHtml(container.name)}</td>
            <td>${escapeHtml(hostName)}</td>
            <td><span class="status-text ${running ? '' : 'bad'}"><span class="dot"></span> ${escapeHtml(state)}</span></td>
            <td>${escapeHtml(startedAt)}</td>
            <td>${escapeHtml(container.restart_count ?? 0)}</td>
          </tr>`;
        }).join('');
      }

      function renderSecurity(hosts) {
        const entries = Object.entries(hosts);
        if (!entries.length) return `<div class="empty-row">${t('noSecurityData')}</div>`;
        return entries.map(([name, host]) => {
          const ufw = host.ufw || {};
          const fail2ban = host.fail2ban || {};
          if (!host.online) {
            return `<div class="security-host"><div class="security-host-name">${escapeHtml(name)}</div><span class="status-text bad">${t('hostUnreachable')}</span></div>`;
          }
          const ufwStatus = ufw.active ? t('active') : t('inactive');
          const failStatus = fail2ban.active ? t('active') : t('inactive');
          const ufwDetails = ufw.raw || t('noUfwOutput');
          const jailDetails = Array.isArray(fail2ban.jails) && fail2ban.jails.length
            ? fail2ban.jails.map((jail) => `${jail}\n${fail2ban.details?.[jail] || t('noDetailsAvailable')}`).join('\n\n')
            : (fail2ban.raw || t('noActiveJails'));
          return `<div class="security-host">
            <div class="security-host-name">${escapeHtml(name)}</div>
            <div class="security-state-row"><span>${t('ufwFirewall')}</span><span class="status-text ${ufw.active ? '' : 'bad'}">${ufwStatus}</span></div>
            <div class="security-state-row"><span>${t('fail2banJails', { count: (fail2ban.jails || []).length })}</span><span class="status-text ${fail2ban.active ? '' : 'bad'}">${failStatus}</span></div>
            <details><summary>${t('firewallRules')}</summary><div class="security-detail">${escapeHtml(ufwDetails)}</div></details>
            <details><summary>${t('fail2banDetails')}</summary><div class="security-detail">${escapeHtml(jailDetails)}</div></details>
          </div>`;
        }).join('');
      }

      function addHistory(hosts) {
        const online = Object.values(hosts).filter((host) => host?.online);
        const sample = {
          cpu: average(online.map((host) => host.cpu_percent)),
          ram: average(online.map((host) => host.ram_percent)),
          disk: average(online.map((host) => host.storage_percent)),
          temperature: average(online.map((host) => host.temperature_c))
        };
        Object.entries(sample).forEach(([key, value]) => {
          chartHistory[key].push(value);
          if (chartHistory[key].length > maxHistory) chartHistory[key].shift();
        });
        chartHistory.times ||= [];
        chartHistory.times.push(Date.now());
        if (chartHistory.times.length > maxHistory) chartHistory.times.shift();
        return sample;
      }

      function renderDashboard(hosts, sample = addHistory(hosts)) {
        latestDashboard = hosts;
        latestSample = sample;
        const names = Object.keys(hosts);
        const onlineCount = Object.values(hosts).filter((host) => host?.online).length;
        const dockerCount = Object.values(hosts).reduce((total, host) => total + (Array.isArray(host?.docker) ? host.docker.length : 0), 0);
        const temps = Object.values(hosts).filter((host) => host?.online).map((host) => finite(host.temperature_c)).filter((value) => value !== null);
        const numberFormat = new Intl.NumberFormat(locale(), { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        const tempRange = temps.length ? `${numberFormat.format(Math.min(...temps))}° – ${numberFormat.format(Math.max(...temps))}°` : t('noTemperatureData');
        const diskFree = Object.values(hosts).filter((host) => host?.online).map((host) => host.storage_free_bytes).filter((value) => finite(value) !== null);
        const metricCards = [
          renderMetric('cpu', t('cpu'), formatPercent(sample.cpu), t('averageUsage'), t('onlineHosts', { online: onlineCount, total: names.length })),
          renderMetric('ram', t('ram'), formatPercent(sample.ram), t('averageUsage'), t('allReachableHosts')),
          renderMetric('disk', t('disk'), formatPercent(sample.disk), t('averageOccupancy'), diskFree.length ? `${formatBytes(diskFree.reduce((sum, value) => sum + Number(value), 0))} ${t('free')}` : t('rootFilesystem')),
          renderMetric('temperature', t('temperature'), formatTemperature(sample.temperature), t('averageAllHosts'), tempRange)
        ].join('');
        const systemState = document.querySelector('#system-state');
        systemState.innerHTML = `<span class="dot"></span>${onlineCount === names.length && names.length ? t('allSystemsOnline') : t('onlineHosts', { online: onlineCount, total: names.length })}`;
        systemState.style.color = onlineCount === names.length && names.length ? 'var(--cyan)' : 'var(--amber)';

        document.querySelector('#app').innerHTML = `
          <div class="metrics-grid">${metricCards}</div>
          <section class="panel hosts-panel" id="hosts">
            <div class="panel-heading"><h2 class="panel-title">${t('hosts')}</h2><span class="panel-meta">${t('hostsOnline', { count: onlineCount })}</span></div>
            ${renderHostRows(hosts)}
          </section>
          ${renderChart(t('systemResources'), [
            { label: t('cpu'), color: colors.cpu, values: chartHistory.cpu },
            { label: t('ram'), color: colors.ram, values: chartHistory.ram },
            { label: t('disk'), color: colors.disk, values: chartHistory.disk }
          ], { className: 'resource-panel' })}
          ${renderChart(t('temperatureTrend'), [
            { label: t('temperature'), color: colors.temperature, values: chartHistory.temperature }
          ], { className: 'temperature-panel', max: 60, ticks: [20, 30, 40, 50, 60], suffix: '°' })}
          <section class="panel containers-panel" id="containers">
            <div class="panel-heading">
              <h2 class="panel-title">${t('containerServices')}</h2>
              <span class="panel-meta">${t(dockerCount === 1 ? 'containerCountSingular' : 'containerCountPlural', { count: dockerCount })}</span>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>${t('containers')}</th><th>${t('host')}</th><th>${t('status')}</th><th>${t('started')}</th><th>${t('restarts')}</th></tr></thead>
                <tbody>${renderContainers(hosts)}</tbody>
              </table>
            </div>
          </section>
          <div class="side-stack">
            <section class="panel">
              <div class="panel-heading">
                <h2 class="panel-title">${t('hostResources')}</h2>
                ${legend([[t('cpu'), colors.cpu], [t('ram'), colors.ram]])}
              </div>
              <div class="resource-list">${renderHostResources(hosts)}</div>
            </section>
            <section class="panel" id="security">
              <div class="panel-heading">
                <h2 class="panel-title">${t('securityStatus')}</h2>
                <span class="panel-meta">UFW · Fail2Ban</span>
              </div>
              <div class="security-content">${renderSecurity(hosts)}</div>
            </section>
          </div>`;
      }

      async function loadDashboard() {
        if (loading) return;
        loading = true;
        const errorBanner = document.querySelector('#error-banner');
        try {
          const response = await fetch('/api/dashboard');
          if (!response.ok) throw new Error(t('apiHttpError', { status: response.status }));
          const data = await response.json();
          if (!data || typeof data !== 'object' || Array.isArray(data)) {
            throw new Error(t('invalidData'));
          }
          renderDashboard(data);
          latestError = null;
          errorBanner.hidden = true;
          latestUpdatedAt = Date.now();
          updateTimestamp();
        } catch (error) {
          latestError = error.message || String(error);
          errorBanner.textContent = t('dashboardUpdateError', { error: latestError });
          errorBanner.hidden = false;
          document.querySelector('#system-state').innerHTML = `<span class="dot"></span>${t('connectionError')}`;
          document.querySelector('#system-state').style.color = 'var(--red)';
        } finally {
          loading = false;
        }
      }

      document.querySelectorAll('.nav-link').forEach((link) => {
        link.addEventListener('click', () => {
          document.querySelectorAll('.nav-link').forEach((item) => item.classList.toggle('active', item === link));
        });
      });

      document.querySelector('#language-select').addEventListener('change', (event) => {
        currentLanguage = event.target.value;
        localStorage.setItem('homelab-dashboard-language', currentLanguage);
        applyTranslations();
        updateTimestamp();
        if (latestDashboard) renderDashboard(latestDashboard, latestSample);
        if (latestError) {
          document.querySelector('#system-state').innerHTML = `<span class="dot"></span>${t('connectionError')}`;
          document.querySelector('#error-banner').textContent = t('dashboardUpdateError', { error: latestError });
        }
      });

      applyTranslations();
      loadDashboard();
      setInterval(loadDashboard, 15000);
    </script>
  </body>
</html>
