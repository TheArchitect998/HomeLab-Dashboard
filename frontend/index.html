<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeLab Dashboard</title><style>body{font:15px system-ui;background:#10151c;color:#e8eef5;margin:0}header{padding:18px 4%;background:#18222e;display:flex;justify-content:space-between;align-items:center}header b{font-size:18px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;padding:20px 4%}.card{background:#192532;border:1px solid #2c3c4d;border-radius:12px;padding:16px}.ok{color:#5ee68a}.bad{color:#ff7676}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#223343;padding:10px;border-radius:8px;text-align:center}.value{font-size:22px;font-weight:700}h2{margin-top:0;margin-bottom:12px}h3{margin:12px 0 8px;border-bottom:1px solid #334657;padding-bottom:6px;font-size:14px}.section{margin-bottom:12px;background:#111820;padding:10px;border-radius:6px}.section-title{font-weight:600;margin-bottom:6px;font-size:13px;color:#aabbc8}.section-content{font-size:12px;max-height:200px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;line-height:1.4}table{width:100%;border-collapse:collapse;margin-top:8px}td,th{text-align:left;padding:6px;border-bottom:1px solid #304354;font-size:12px}th{font-weight:600;background:#223343}td{background:#1a2a35}.status-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}.status-value{font-weight:600}.muted{color:#9aabba}.jail-grid{display:grid;gap:10px}.jail-box{background:#111820;border:1px solid #31465b;border-radius:8px;padding:10px}.jail-name{font-size:13px;font-weight:700;color:#96e0ff;margin-bottom:6px}</style></head><body><header><b>HomeLab Dashboard</b><span id="updated" class="muted">Lade…</span></header><main id="app"></main><script>
const esc=s=>String(s??'—').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const normalizeJailName=value=>String(value||'').replace(/^[-`\s]+/,'').trim();
function block(name,d){if(!d.online)return `<section class=card><h2>${esc(name)} <span class=bad>offline</span></h2><p class=bad>${esc(d.error)}</p></section>`;let f=d.fail2ban||{},u=d.ufw||{};let cont=(d.docker||[]).map(x=>`<tr><td>${esc(x.name)}</td><td><span class=${x.state==='running'?'ok':'bad'}>${esc(x.state||x.status)}</span></td><td style="font-size:11px">${esc(x.started_at?new Date(x.started_at).toLocaleString():'—')}</td><td>${esc(x.restart_count)}</td></tr>`).join('')||'<tr><td colspan=4>Keine Container</td></tr>';
const jailEntries=(f.jails||[]).map(raw=>{const key=normalizeJailName(raw);const detail=f.details?.[key]||f.details?.[raw]||'Keine Details verfügbar';return `<div class="jail-box"><div class="jail-name">${esc(key)}</div><div class="section-content">${esc(detail)}</div></div>`;}).join('')||'<div class="muted">Keine Jails aktiv</div>';
return `<section class=card><h2>${esc(name)} <span class=${d.online?'ok':'bad'}>${d.online?'online':'offline'}</span></h2><div class=metrics><div class=metric>Temperatur<div class=value>${esc(d.temperature_c)} °C</div></div><div class=metric>CPU<div class=value>${esc(d.cpu_percent)}%</div></div><div class=metric>RAM<div class=value>${esc(d.ram_percent)}%</div></div><div class=metric>Speicher<div class=value>${esc(d.storage_percent)}%</div></div></div><h3>Sicherheit</h3><div class=status-row><span>UFW:</span><span class=status-value>${u.active?'<span class=ok>Aktiv</span>':'<span class=bad>Inaktiv</span>'}</span></div><div class=section><div class=section-title>UFW-Regeln & Status</div><div class=section-content>${esc(u.raw)}</div></div><div class=status-row><span>Fail2Ban:</span><span class=status-value>${f.active?'<span class=ok>Aktiv</span>':'<span class=bad>Inaktiv</span>'}</span></div><div class=status-row><span>Jails:</span><span class=status-value>${(f.jails||[]).length}</span></div><div class="jail-grid">${jailEntries}</div><h3>Docker</h3><table><tr><th>Container</th><th>Status</th><th>Letzter Start</th><th>Restarts</th></tr>${cont}</table></section>`}
async function load(){try{let r=await fetch('/api/dashboard');let d=await r.json();document.querySelector('#app').innerHTML=Object.entries(d).map(([n,x])=>block(n,x)).join('');document.querySelector('#updated').textContent='Aktualisiert: '+new Date().toLocaleTimeString()}catch(e){document.querySelector('#app').innerHTML='<p class=bad>Dashboard-API nicht erreichbar: '+esc(e)+'</p>'}}load();setInterval(load,15000);
</script></body></html>
