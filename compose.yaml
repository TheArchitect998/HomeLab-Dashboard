services:
  dashboard:
    build: .
    image: labguard:local
    restart: unless-stopped
    environment:
      TZ: "${LABGUARD_TIMEZONE:-${HOMELAB_TIMEZONE:-Etc/UTC}}"
      LABGUARD_DASHBOARD_CONFIG: /etc/labguard.py
    ports:
      - "${LABGUARD_BIND_ADDRESS:-${HOMELAB_BIND_ADDRESS:-127.0.0.1}}:${LABGUARD_PORT:-${HOMELAB_PORT:-8888}}:8888"
    volumes:
      - type: bind
        source: "${LABGUARD_CONFIG_PATH:-${HOMELAB_CONFIG_PATH:-./labguard.config.py}}"
        target: /etc/labguard.py
        read_only: true
        bind:
          create_host_path: false
      - dashboard-state:/opt/labguard/state

volumes:
  dashboard-state:
