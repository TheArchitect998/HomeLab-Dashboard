# Overlay that makes the agent serve HTTPS. Combine with an agent Compose file:
#   docker compose -f compose.agent.yaml -f compose.agent.tls.yaml up -d
# LABGUARD_AGENT_TLS_DIR (legacy HOMELAB_AGENT_TLS_DIR) must contain agent.crt and agent.key.
services:
  agent:
    environment:
      UVICORN_SSL_CERTFILE: /tls/agent.crt
      UVICORN_SSL_KEYFILE: /tls/agent.key
    volumes:
      - type: bind
        source: "${LABGUARD_AGENT_TLS_DIR:-${HOMELAB_AGENT_TLS_DIR:?Set LABGUARD_AGENT_TLS_DIR to the directory with agent.crt and agent.key}}"
        target: /tls
        read_only: true
        bind:
          create_host_path: false
